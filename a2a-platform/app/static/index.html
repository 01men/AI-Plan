<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>榕器 · 资源绑定与运行台</title><style>body{font:14px system-ui;margin:2rem;background:#f7f9fc;color:#172033}main{max-width:1080px;margin:auto}section{background:white;padding:1rem 1.2rem;margin:1rem 0;border-radius:10px;box-shadow:0 1px 4px #dce2ed}input,select,button{padding:.5rem;margin:.2rem}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:.5rem;border-bottom:1px solid #e8edf4}.muted{color:#64748b}.ok{color:#15803d}.bad{color:#b91c1c}</style><main><h1>榕器 · 远端资源绑定与运行台</h1><p class="muted">管理员：连接 → 验证 → 授权 → 启用。业务人员仅在项目行动中看到业务状态。</p><section><h2>登记远端 Agent</h2><input id="name" placeholder="服务名称"><input id="endpoint" placeholder="https://agent.example"><input id="owner" placeholder="责任人"><select id="domain"><option>trusted_remote</option><option>isolated_runner</option></select><button onclick="register()">登记</button><p id="notice"></p></section><section><h2>资源目录</h2><table><thead><tr><th>名称</th><th>状态</th><th>版本</th><th>责任人</th><th>操作</th></tr></thead><tbody id="resources"></tbody></table></section><section><h2>运行账本</h2><button onclick="tick()">立即派发</button><table><thead><tr><th>任务契约</th><th>远端 Run</th><th>状态</th><th>最后回查</th></tr></thead><tbody id="runs"></tbody></table></section></main><script>const api=(u,o={})=>fetch(u,{headers:{'Content-Type':'application/json','X-Actor':'管理员'},...o}).then(async r=>{let x=await r.json();if(!r.ok)throw Error(x.detail);return x});const n=x=>document.getElementById('notice').textContent=x;function esc(x){return String(x||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}async function load(){let rs=await api('/api/resources');resources.innerHTML=rs.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.status)}</td><td>${esc(r.version)}</td><td>${esc(r.owner)}</td><td><button onclick="discover('${r.id}')">发现</button><button onclick="validate('${r.id}')">验证</button><button onclick="pause('${r.id}')">暂停</button></td></tr>`).join('')||'<tr><td colspan=5>暂无资源</td></tr>';let runs=await api('/api/runs');window.runs.innerHTML=runs.map(r=>`<tr><td>${esc(r.contract_id)}</td><td>${esc(r.external_run_id)}</td><td>${esc(r.state)}</td><td>${esc(r.last_reconciled_at)}</td></tr>`).join('')||'<tr><td colspan=4>暂无运行记录</td></tr>'}async function register(){try{await api('/api/resources',{method:'POST',body:JSON.stringify({type:'agent',name:name.value,endpoint:endpoint.value,owner:owner.value,execution_domain:domain.value})});n('已登记，下一步请发现并进行无副作用验证。');load()}catch(e){n(e.message)}}async function discover(id){try{await api('/api/resources/'+id+'/discover',{method:'POST'});n('能力发现成功。');load()}catch(e){n(e.message)}}async function validate(id){try{await api('/api/resources/'+id+'/sandbox-validate',{method:'POST'});n('无副作用验证成功；请通过审批票据后启用。');load()}catch(e){n(e.message)}}async function pause(id){await api('/api/resources/'+id+'/pause',{method:'POST',body:'{}'});load()}async function tick(){await api('/api/worker/tick',{method:'POST',body:'{}'});load()}load()</script></html>
